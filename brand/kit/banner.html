<!doctype html><html><head><link rel="stylesheet" href="base.css"><style>
body{width:1500px;height:500px;background:#06051a;color:#fff}
.au{position:absolute;inset:0;background:
 radial-gradient(ellipse 38% 80% at 78% 40%, rgba(88,96,255,.6), transparent 70%),
 radial-gradient(ellipse 30% 60% at 98% 95%, rgba(190,100,255,.55), transparent 70%),
 radial-gradient(ellipse 30% 55% at 40% -10%, rgba(70,140,255,.35), transparent 70%),
 radial-gradient(ellipse 25% 50% at 55% 110%, rgba(255,140,170,.18), transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask:radial-gradient(ellipse 60% 90% at 70% 50%,#000,transparent 75%)}
.t{position:absolute;left:380px;top:96px}
.eb{display:inline-flex;align-items:center;gap:10px;font-family:"GM";font-size:14px;letter-spacing:4px;color:rgba(255,255,255,.7);text-transform:uppercase;padding:8px 14px;border:1px solid rgba(255,255,255,.16);border-radius:99px;background:rgba(255,255,255,.04)}
.eb i{width:8px;height:8px;border-radius:50%;background:#8f9bff;box-shadow:0 0 12px #8f9bff}
h1{font-family:"IS";font-weight:400;font-size:92px;line-height:.93;letter-spacing:-2px;margin-top:20px;color:#fff}
h1 em{background-image:linear-gradient(100deg,#8f9bff 0%,#b48cff 50%,#ff9ad5 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent}
.win{position:absolute;right:70px;top:70px;width:440px;border-radius:20px;background:rgba(18,17,48,.6);border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 1px rgba(143,155,255,.08),0 40px 90px -30px rgba(0,0,0,.8),0 0 80px -10px rgba(100,100,255,.45);overflow:hidden;transform:rotate(2.5deg);backdrop-filter:blur(20px)}
.bar{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);align-items:center}.bar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
.bar span{margin-left:auto;font-family:"GM";font-size:11px;letter-spacing:2px;color:#8f9bff}
.chat{padding:14px;display:flex;flex-direction:column}
.you{align-self:flex-end;background:linear-gradient(120deg,#4b4fff,#8a4dff);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:15px;box-shadow:0 10px 30px -10px rgba(110,90,255,.8)}
.code{background:rgba(5,5,18,.7);color:#e6e4ff;font-family:"GM";font-size:13.5px;line-height:1.75;padding:14px 18px;white-space:pre}
.k{color:#9aa2ff}.ty{color:#ffc98a}.f{color:#7fe0c4}.n{color:#ff9ad5}
.url{position:absolute;left:384px;bottom:46px;font-family:"GM";font-size:15px;letter-spacing:3px;color:rgba(255,255,255,.6)}
.url b{color:#fff;font-weight:500}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head><body><div class="au"></div><div class="grid"></div>
<div class="t"><div class="eb"><i></i>AI smart contract studio · Robinhood Chain</div><h1>Speak your contract<br><em>into existence.</em></h1></div>
<div class="win"><div class="bar"><i></i><i></i><i></i><span>● WRITING</span></div>
<div class="chat"><div class="you">A token with a 2% fee to my wallet</div></div>
<div class="code"><span class="k">contract</span> <span class="ty">MoonCoin</span> is ERC20 {
    <span class="k">uint256 public</span> feeBps = <span class="n">200</span>;
    <span class="k">uint256 public constant</span> MAX = <span class="n">500</span>;
    <span class="k">function</span> <span class="f">transfer</span>(...) ...
}</div></div>
<div class="url"><b>USEPARLO.XYZ</b> &nbsp;·&nbsp; ONE SENTENCE. ONE CONTRACT.</div>
<div class="grain"></div>
</body></html>
