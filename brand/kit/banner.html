<!doctype html><html><head><link rel="stylesheet" href="base.css"><style>
body{width:1500px;height:500px;background:#f4f1ea;color:#16150f}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(22,21,15,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(22,21,15,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask:radial-gradient(ellipse 55% 90% at 75% 50%,#000,transparent 75%)}
.t{position:absolute;left:380px;top:92px}
.eb{display:inline-flex;align-items:center;gap:10px;font-family:"GM";font-size:14px;letter-spacing:4px;color:#3a382f;text-transform:uppercase;padding:8px 14px;border:1px solid rgba(22,21,15,.16);border-radius:99px;background:rgba(255,255,255,.6)}
.eb i{width:8px;height:8px;border-radius:50%;background:#3440ff}
h1{font-family:"IS";font-weight:400;font-size:92px;line-height:.93;letter-spacing:-2px;margin-top:20px}
h1 em{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#3440ff!important}
.win{position:absolute;right:70px;top:72px;width:440px;border-radius:20px;background:#16150f;color:#e9e5d8;box-shadow:0 50px 80px -40px rgba(22,21,15,.55);overflow:hidden;transform:rotate(2.5deg)}

.code{background:#0e0d09;font-family:"GM";font-size:13.5px;line-height:1.75;padding:14px 18px;white-space:pre}
.k{color:#9aa2ff}.ty{color:#f0c674}.f{color:#8fdcb8}.n{color:#f0c674}
.url{position:absolute;left:384px;bottom:46px;font-family:"GM";font-size:15px;letter-spacing:3px;color:#7a766a}
.url b{color:#16150f;font-weight:500}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.au{position:absolute;inset:0;overflow:hidden}.au i{position:absolute;border-radius:50%;filter:blur(80px)}.a1{width:620px;height:620px;left:880px;top:-120px;background:rgba(52,64,255,.32)}.a2{width:520px;height:520px;left:1120px;top:180px;background:rgba(139,92,255,.24)}.a3{width:520px;height:520px;left:180px;top:-260px;background:rgba(255,170,120,.28)}</style></head><body><div class="au"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div><div class="grid"></div>

    <span class="k">uint256 public constant</span> MAX = <span class="n">500</span>;
    <span class="k">function</span> <span class="f">transfer</span>(...) ...
}</div></div>
<div class="url"><b>USEPARLO.XYZ</b> &nbsp;·&nbsp; ONE SENTENCE. ONE CONTRACT.</div>
<div class="grain"></div>
</body></html>
