<!doctype html><html><head><link rel="stylesheet" href="base.css"><style>
body{width:1000px;height:1000px;display:grid;place-items:center;background:#06051a}
.bloom{position:absolute;inset:0;background:
 radial-gradient(circle at 50% 52%, rgba(88,96,255,.75) 0%, rgba(88,96,255,0) 42%),
 radial-gradient(circle at 70% 75%, rgba(190,100,255,.55) 0%, transparent 40%),
 radial-gradient(circle at 28% 25%, rgba(70,140,255,.45) 0%, transparent 38%)}
.halo{position:absolute;width:760px;height:760px;border-radius:50%;
 background:conic-gradient(from 210deg, transparent 0deg, rgba(150,160,255,.9) 60deg, rgba(200,120,255,.9) 120deg, transparent 200deg, transparent 360deg);
 -webkit-mask:radial-gradient(circle, transparent 368px, #000 370px, #000 374px, transparent 376px);filter:blur(.6px)}
.halo.soft{filter:blur(18px);opacity:.8}
.m{position:relative;width:560px;height:560px;filter:drop-shadow(0 0 60px rgba(120,110,255,.65)) drop-shadow(0 40px 50px rgba(0,0,0,.6))}
.m svg{width:100%;height:100%}
.grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head><body><div class="bloom"></div><div class="halo soft"></div><div class="halo"></div>
<div class="m"><svg viewBox="0 0 32 32" fill="none">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d8bff"/><stop offset=".5" stop-color="#4b4fff"/><stop offset="1" stop-color="#9b4dff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".45" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path id="bub" d="M6 4h20a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H14l-6.5 5.2a.8.8 0 0 1-1.3-.62V24H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" fill="url(#body)"/>
<path d="M6 4h20a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H14l-6.5 5.2a.8.8 0 0 1-1.3-.62V24H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" fill="url(#shine)"/>
<path d="M6 4h20a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H14l-6.5 5.2a.8.8 0 0 1-1.3-.62V24H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" stroke="url(#edge)" stroke-width=".35"/>
<g filter="url(#glow)"><path d="M12.5 10.5 9 14l3.5 3.5M19.5 10.5 23 14l-3.5 3.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<circle cx="26.5" cy="5.5" r="3.2" fill="#0b0a24" stroke="#fff" stroke-width="1.2"/>
<circle cx="26.5" cy="5.5" r="1.1" fill="#9fa8ff" filter="url(#glow)"/>
</svg></div><div class="grain"></div></body></html>
